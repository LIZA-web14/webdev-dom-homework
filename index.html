<!DOCTYPE html>
<html>
  <head>
    <title>Проект «Комменты»</title>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <div class="container">
      <ul class="comments"></ul>

      <div class="add-form">
        <input
          type="text"
          class="add-form-name"
          placeholder="Введите ваше имя"
        />

        <textarea
          class="add-form-text"
          placeholder="Введите ваш комментарий"
          rows="4"
        ></textarea>

        <div class="add-form-row">
          <button class="add-form-button">
            Написать
          </button>
        </div>
      </div>
    </div>

    <script>
      const commentsList = document.querySelector('.comments');
      const nameInput = document.querySelector('.add-form-name');
      const textInput = document.querySelector('.add-form-text');
      const addButton = document.querySelector('.add-form-button');

      let comments = [
        {
          name: 'Глеб Фокин',
          date: '12.02.22 12:18',
          text: 'Это будет первый комментарий на этой странице',
          likes: 3,
          isLiked: false,
        },
        {
          name: 'Варвара Н.',
          date: '13.02.22 19:22',
          text: 'Мне нравится как оформлена эта страница! ❤',
          likes: 75,
          isLiked: true,
        },
      ];

      function renderComments() {
        commentsList.innerHTML = comments
          .map((comment, index) => {
            let activeClass = '';

            if (comment.isLiked) {
              activeClass = '-active-like';
            }

            return `
              <li class="comment">
                <div class="comment-header">
                  <div>${comment.name}</div>
                  <div>${comment.date}</div>
                </div>

                <div class="comment-body">
                  <div class="comment-text">
                    ${comment.text}
                  </div>
                </div>

                <div class="comment-footer">
                  <div class="likes">
                    <span class="likes-counter">
                      ${comment.likes}
                    </span>

                    <button
                      class="like-button ${activeClass}"
                      data-comment-index="${index}"
                    ></button>
                  </div>
                </div>
              </li>
            `;
          })
          .join('');
      }

      commentsList.addEventListener('click', (event) => {
        const likeButton = event.target.closest('.like-button');

        if (!likeButton) {
          return;
        }

        const commentIndex = Number(likeButton.dataset.commentIndex);
        const comment = comments[commentIndex];

        if (comment.isLiked === false) {
          comment.isLiked = true;
          comment.likes = comment.likes + 1;
        } else {
          comment.isLiked = false;
          comment.likes = comment.likes - 1;
        }

        renderComments();
      });

      addButton.addEventListener('click', () => {
        const name = nameInput.value.trim();
        const text = textInput.value.trim();

        // Если хотя бы одно поле пустое — ничего не делаем
        if (name === '' || text === '') {
          return;
        }

        // Формируем дату строго в формате дд.мм.гг чч:мм для задания
        const now = new Date();
        const day = String(now.getDate()).padStart(2, '0');
        const month = String(now.getMonth() + 1).padStart(2, '0');
        const year = String(now.getFullYear()).slice(-2);
        const hours = String(now.getHours()).padStart(2, '0');
        const minutes = String(now.getMinutes()).padStart(2, '0');

        comments.push({
          name: name,
          date: `${day}.${month}.${year} ${hours}:${minutes}`,
          text: text,
          likes: 0,
          isLiked: false,
        });

        nameInput.value = '';
        textInput.value = '';

        renderComments();
      });

      // Первый запуск отрисовки начальных комментариев
      renderComments();
    </script>
  </body>
</html>
